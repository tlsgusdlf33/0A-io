name: 앱 빌드 (비공개 저장소 0A-1 코드 사용)

# 손으로만 실행한다 (외부 PR로는 돌지 않음). 코드·서명키는 0A-1 에만 있고, 결과물은 0A-1 Releases 로 보낸다.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "story(동화) / grant(지원금) / site(개인정보처리방침 배포) / art(동화 삽화 생성 후 0A-1에 저장)"
        required: true
        default: story
        type: choice
        options: [story, grant, site, art]

permissions:
  contents: read

jobs:
  android:
    if: inputs.app == 'story' || inputs.app == 'grant'
    runs-on: ubuntu-latest
    steps:
      - run: echo "VC=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: tlsgusdlf33/0A-1
          token: ${{ secrets.OA1_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build APK and AAB
        run: bash tools/make-android.sh ${{ inputs.app }}
      - name: Publish to 0A-1 releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.app }}-${{ env.VC }}
          name: "${{ inputs.app }} #${{ env.VC }}"
          repository: tlsgusdlf33/0A-1
          token: ${{ secrets.OA1_TOKEN }}
          body: |
            - `${{ inputs.app }}-debug.apk`: 폰에 바로 설치해 보는 파일
            - `${{ inputs.app }}-release.aab`: 구글 플레이 콘솔에 올리는 파일 (versionCode ${{ env.VC }})
          files: |
            out/${{ inputs.app }}-debug.apk
            out/${{ inputs.app }}-release.aab
      - name: Keep only the latest 3 releases of this app
        env:
          GH_TOKEN: ${{ secrets.OA1_TOKEN }}
        run: |
          gh release list -R tlsgusdlf33/0A-1 --limit 200 --json tagName -q '.[].tagName' \
            | grep "^${{ inputs.app }}-" | sort -t- -k2 -n -r | tail -n +4 \
            | while read -r t; do gh release delete "$t" -R tlsgusdlf33/0A-1 --yes --cleanup-tag; done

  site:
    if: inputs.app == 'site'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tlsgusdlf33/0A-1
          token: ${{ secrets.OA1_TOKEN }}
          persist-credentials: false
          sparse-checkout: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4

  # 무료 이미지 생성(Pollinations)으로 동화 삽화를 만들어 비공개 저장소에 저장. 이미 있는 그림은 건너뜀.
  art:
    if: inputs.app == 'art'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tlsgusdlf33/0A-1
          token: ${{ secrets.OA1_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/make-art.js
      - run: |
          git config user.name "art-bot"; git config user.email "art-bot@users.noreply.github.com"
          git add apps/story/www/art
          git diff --cached --quiet || { git commit -m "Add story illustrations" && git push; }

  # 공개 저장소에 키·비밀번호·앱 코드가 섞여 들어오지 않았는지 매번 검사 (파일 이름만 기록)
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          bad=0
          f=$(git ls-files | grep -E -i '\.(keystore|jks|p12|pem|key)$|signing\.env$|google-services\.json$|^apps/|^tools/|\.(apk|aab)$' || true)
          if [ -n "$f" ]; then echo "::error::보안 자료/앱 코드 파일 발견:"; echo "$f"; bad=1; fi
          c=$(git grep -l -I -E 'UPLOAD_PASS=|github_pat_|ghp_[A-Za-z0-9]{20}|BEGIN (RSA |EC )?PRIVATE KEY|window\.STORIES|window\.PROGRAMS' -- . ':!.github/workflows/build.yml' || true)
          if [ -n "$c" ]; then echo "::error::비밀 값/앱 코드 의심 내용 발견:"; echo "$c"; bad=1; fi
          [ $bad -eq 0 ] && echo "공개 저장소 검사 통과"
          exit $bad
